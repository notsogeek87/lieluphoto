name: Android build

# Pas de trigger pull_request : chaque push est déjà buildé, sinon push + PR
# lançaient deux builds identiques.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "doc/**"
      - "**.md"
      - "**.MD"
  workflow_dispatch:

permissions:
  contents: write

# Un seul build à la fois par branche. Sur main on n'annule jamais : chaque push
# garde sa release versionnée, ils passent l'un après l'autre.
concurrency:
  group: android-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installer NDK et CMake
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.22.1"

      # Clés du service IA intégré : facultatives (secrets absents = clé vide).
      - name: Écrire local.properties
        env:
          BUILT_IN_API_KEY: ${{ secrets.BUILT_IN_API_KEY }}
          BUILT_IN_API_KEY_GOOGLE: ${{ secrets.BUILT_IN_API_KEY_GOOGLE }}
        run: |
          {
            printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            printf 'BUILT_IN_API_KEY=%s\n' "$BUILT_IN_API_KEY"
            printf 'BUILT_IN_API_KEY_GOOGLE=%s\n' "$BUILT_IN_API_KEY_GOOGLE"
          } > local.properties

      # versionCode = 1000 + run_number (strictement croissant), versionName = version de
      # app/build.gradle.kts, tag de release v<version>.<run_number>.
      - name: Déterminer la version
        id: version
        run: |
          BASE=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      # Clé de publication (secrets KEYSTORE_*) : même signature à chaque build, donc chaque
      # APK s'installe par-dessus le précédent. Sans les secrets, une branche retombe sur
      # app/debug.keystore (clé publique, APK de test seulement) ; main refuse de publier.
      - name: Décoder la clé de publication
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "::error::Secret KEYSTORE_BASE64 absent : main ne publie pas de release signée par debug.keystore."
              exit 1
            fi
            echo "::warning::Secrets KEYSTORE_* absents : APK de test signé par debug.keystore."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "store_file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Compiler l'APK (release)
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ steps.signing.outputs.release == 'true' && steps.signing.outputs.store_file || 'debug.keystore' }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ steps.signing.outputs.release == 'true' && secrets.KEYSTORE_PASSWORD || 'android' }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ steps.signing.outputs.release == 'true' && secrets.KEY_ALIAS || 'androiddebugkey' }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ steps.signing.outputs.release == 'true' && secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew :app:assembleDefaultRelease --console=plain --stacktrace --info \
            -PversionCodeOverride=$((1000 + ${{ github.run_number }}))

      # L'empreinte attendue est publique (certificat CN=LieluPhoto) : une APK signée par une
      # autre clé, ou par des secrets mal saisis, n'est jamais publiée.
      - name: Vérifier la signature
        if: steps.signing.outputs.release == 'true'
        env:
          EXPECTED_SHA256: 5a0bbef8aa9f28169030647b5ec8102b47a9ac05e8efacc448583a493d9a2dc6
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls -d "$SDK_DIR"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/default/release/*.apk | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate DN|SHA-256 digest"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256 digest" | sed 's/.*: //')
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::Empreinte de signature inattendue : $ACTUAL"
            exit 1
          fi


      - name: Upload logs de build en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/logs/
            **/build.log
            **/compile*.log
          if-no-files-found: ignore
          compression-level: 9
      - name: Renommer l'APK avec sa version
        id: apk
        run: |
          NAME="LieluPhoto-${{ steps.version.outputs.name }}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/default/release/*.apk "dist/$NAME"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lieluphoto-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          compression-level: 0

      # Vraie release permanente pour chaque push sur main (ou lancement manuel sur main).
      - name: Publier la release GitHub (main)
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          cat > release-notes.md <<'NOTES'
          ## Installer LieluPhoto

          1. Télécharge l'APK `${{ steps.apk.outputs.name }}` ci-dessous (section « Assets »).
          2. Ouvre-le. Si Android bloque l'installation, autorise la source (navigateur ou gestionnaire de fichiers) à installer des applications inconnues.
          3. Touche « Installer ».

          Tous les APK ont la même clé de signature : une nouvelle version s'installe par-dessus l'ancienne, tes réglages sont conservés. Si Android refuse (« app non installée »), désinstalle l'ancienne version une fois, puis réinstalle.

          Les versions jusqu'à 1.28.4.292 étaient signées avec une clé de debug publique : pour passer à celle-ci, désinstalle l'ancienne une fois.

          ---
          Run #${{ github.run_number }} (${{ github.sha }}). Signé avec la clé de publication LieluPhoto (SHA-256 `5A:0B:BE:F8:AA:9F:28:16:90:30:64:7B:5E:C8:10:2B:47:A9:AC:05:E8:EF:AC:C4:48:58:3A:49:3D:9A:2D:C6`).
          NOTES
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "LieluPhoto $TAG" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"

      # Autres branches : un tag de pré-release par branche, remplacé à chaque build.
      - name: Publier l'APK de test en pré-release
        if: github.ref_name != 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          TAG="debug-$(echo "$BRANCH" | tr '/' '-')"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "${{ steps.apk.outputs.path }}" \
            --title "LieluPhoto — APK de test ($BRANCH)" \
            --notes "Build de test de la branche. Run #${{ github.run_number }} (${{ github.sha }})." \
            --prerelease \
            --target "${{ github.sha }}"
