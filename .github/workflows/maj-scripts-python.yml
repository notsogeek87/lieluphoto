# Ponctuel (audit 2026-11-11) : relève dans scripts/uv.lock les paquets signalés par
# Trivy (pillow, certifi, urllib3, soupsieve), vérifie que les scripts importent
# toujours leurs modules, re-scanne, commite le lock et se supprime lui-même.
# Scripts de calibration non livrés dans l'APK : commit en [skip ci] (pas de release).
name: maj-scripts-python
on:
  push:
    branches: ["security/fix-2026-11-11"]
    paths: [".github/workflows/maj-scripts-python.yml"]
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_VERSION: "0.72.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Mise à jour du lock
        working-directory: scripts
        run: |
          set -euo pipefail
          python -m pip install --quiet uv
          uv lock --upgrade-package pillow --upgrade-package certifi \
                  --upgrade-package urllib3 --upgrade-package soupsieve
          uv sync --frozen
          uv run --frozen python -c "import PIL, certifi, urllib3, soupsieve, bs4, numpy, rawpy, colour, requests; print('PIL', PIL.__version__, '| certifi', certifi.__version__, '| urllib3', urllib3.__version__, '| soupsieve', soupsieve.__version__)"
          for f in *.py; do python -m py_compile "$f"; done
          rm -rf .venv
      - name: Re-scan Trivy (binaire vérifié)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tgz="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/$tgz"; curl -fsSLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "trivy_${TRIVY_VERSION}_checksums.txt"
          gh attestation verify "$tgz" --repo aquasecurity/trivy
          tar xzf "$tgz" trivy
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/trivy" fs --scanners vuln --skip-version-check --severity CRITICAL,HIGH,MEDIUM scripts/
      - name: Commit
        run: |
          set -euo pipefail
          git rm -q .github/workflows/maj-scripts-python.yml
          git add scripts/uv.lock
          git -c user.name="github-actions[bot]" -c user.email="41898333+github-actions[bot]@users.noreply.github.com" \
            commit -m "fix(scripts): relève pillow, certifi, urllib3, soupsieve dans uv.lock (audit Trivy) [skip ci]"
          git push
